<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a0c12">
<title>qsyy · 收藏播放器</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23e8ecf3'/%3E%3Cpath d='M24 22v20M40 22v20M24 32h16' stroke='%230a0c12' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/style.css">
<link rel="manifest" href="/manifest.webmanifest">
</head>
<body>
<div id="app">

  <aside class="sidebar">
    <div id="user" class="user"></div>
    <div class="nav-caption">我的歌单</div>
    <nav id="playlists" class="playlists"></nav>
    <div class="sidebar-foot">
      <button id="refresh" class="foot-btn" title="重新拉取收藏歌单"><svg class="ic" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 6.3M20 5v6h-6"/></svg>同步收藏</button>
      <button id="store-btn" class="foot-btn" title="缓存库管理:列表 / 切换 / 备份 / 导入" style="grid-column: 1 / -1;"><svg class="ic" viewBox="0 0 24 24"><path d="M3 7l9-4 9 4-9 4zM3 7v6m0 0l9 4 9-4V7M12 17v4"/></svg>管理缓存</button>
      <input id="restore-file" type="file" accept=".tar" style="display:none">
      <div id="foot-hint" class="foot-hint">未缓存的歌需先在汽水音乐里播放一次</div>
    </div>
  </aside>

  <main class="main">
    <div id="hero" class="hero"></div>
    <div class="toolbar">
      <div class="search-wrap">
        <span class="search-icon"><svg class="ic" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg></span>
        <input id="search" type="text" placeholder="在当前歌单内搜索…" autocomplete="off">
      </div>
      <div class="toolbar-actions">
        <select id="fx-select" class="pill-select" title="音效:智能音效为汽水接口逐曲调校,其余为官方同款目录,Web Audio 实时渲染"></select>
        <select id="quality-select" class="pill-select" title="下载音质">
          <option value="lossless">无损音质</option>
          <option value="hi_res">Hi-Res</option>
          <option value="spatial">空间音频</option>
          <option value="highest" selected>极高音质</option>
          <option value="higher">高音质</option>
          <option value="medium">标准音质</option>
        </select>
        <select id="format-select" class="pill-select" title="默认下载格式">
          <option value="source" selected>源文件</option>
          <option value="m4a">M4A</option>
          <option value="mp3">MP3</option>
          <option value="flac">FLAC</option>
          <option value="wav">WAV</option>
          <option value="ogg">OGG</option>
        </select>
        <button id="download-all" class="btn ghost" title="批量下载当前列表(已缓存的歌)"><svg class="ic" viewBox="0 0 24 24"><path d="M12 4v11m0 0l-4.5-4.5M12 15l4.5-4.5M5 19.5h14"/></svg>下载全部</button>
        <button id="download-current" class="btn ghost" title="下载当前播放的歌曲"><svg class="ic" viewBox="0 0 24 24"><path d="M12 4v9m0 0l-3.5-3.5M12 13l3.5-3.5M7 18h10"/></svg>下载单曲</button>
      </div>
    </div>
    <div id="list-head" class="list-head">
      <span class="h-idx">#</span><span class="h-title">标题</span>
      <span class="h-artist">歌手</span><span class="h-album">专辑</span>
      <span class="h-dur">时长</span><span class="h-cache">缓存</span>
    </div>
    <div id="tracks" class="tracks"></div>
    <div id="sentinel" class="sentinel"></div>
  </main>

  <footer class="player" id="player">
    <div class="now">
      <img id="p-cover" class="cover" alt="">
      <div class="meta">
        <div id="p-title" class="title">qsyy 收藏播放器</div>
        <div id="p-artist" class="artist">选一首歌开始 · 空格播放/暂停</div>
      </div>
    </div>
    <div class="controls">
      <div class="buttons">
        <button id="p-shuffle" class="mode" title="随机播放"><svg class="ic" viewBox="0 0 24 24"><path d="M3 7h3.5c5.5 0 8.5 10 14 10H21M3 17h3.5c2.2 0 3.9-1.5 5.2-3.2M12.4 10.1C13.7 8.5 15.4 7 17.5 7H21M18.5 4.5L21 7l-2.5 2.5M18.5 14.5L21 17l-2.5 2.5"/></svg></button>
        <button id="p-prev" title="上一首"><svg class="ic" viewBox="0 0 24 24"><path d="M18 6v12L8.5 12zM6 5.5v13"/></svg></button>
        <button id="p-play" class="play" title="播放/暂停 (空格)"><svg class="ic solid" viewBox="0 0 24 24"><path d="M8 5.5v13l10-6.5z"/></svg></button>
        <button id="p-next" title="下一首"><svg class="ic" viewBox="0 0 24 24"><path d="M6 6v12l9.5-6zM18 5.5v13"/></svg></button>
        <button id="p-repeat" class="mode" title="循环模式"><svg class="ic" viewBox="0 0 24 24"><path d="M4 12V9a3 3 0 0 1 3-3h13m0 0l-3-3m3 3l-3 3M20 12v3a3 3 0 0 1-3 3H4m0 0l3 3m-3-3l3-3"/></svg></button>
      </div>
      <div class="progress">
        <span id="p-cur" class="time">0:00</span>
        <div class="seekbar" id="p-seekbar" title="拖动快进 / 快退">
          <div class="rail"></div>
          <div class="buffer" id="p-buffer"></div>
          <div class="fill" id="p-fill"></div>
          <div class="thumb" id="p-thumb"></div>
        </div>
        <span id="p-dur" class="time">0:00</span>
      </div>
    </div>
    <div class="player-side">
      <button id="p-lyrics-btn" class="side-btn" title="歌词"><svg class="ic" viewBox="0 0 24 24"><path d="M5 5h14M5 9.5h14M5 14h9M5 18.5h6"/></svg></button>
      <button id="p-queue-btn" class="side-btn" title="播放队列"><svg class="ic" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span id="p-queue-count" class="count"></span></button>
      <span class="vol-wrap"><span id="p-vol-icon" title="静音切换"></span><input id="p-vol" type="range" min="0" max="100" value="90" title="音量"></span>
      <button id="p-downloads-btn" class="side-btn" title="下载任务"><svg class="ic" viewBox="0 0 24 24"><path d="M12 4v11m0 0l-4.5-4.5M12 15l4.5-4.5M5 19.5h14"/></svg></button>
    </div>
    <audio id="audio" preload="none"></audio>
  </footer>

  <div id="queue-panel" class="panel hidden">
    <header>播放队列 <button id="close-queue" class="panel-close"><svg class="ic" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></header>
    <div id="queue-list" class="panel-body"></div>
  </div>

  <div id="downloads-panel" class="panel hidden">
    <header>下载任务 <button id="close-downloads" class="panel-close"><svg class="ic" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></header>
    <div id="download-list" class="panel-body"></div>
  </div>

  <div id="store-panel" class="panel hidden">
    <header>管理缓存 <button id="store-close" class="panel-close"><svg class="ic" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></header>
    <div class="store-body">
      <div class="store-section">
        <div class="store-cap">缓存库 <span id="store-sets-hint" class="cap-hint"></span></div>
        <div id="store-sets" class="store-sets"></div>
        <div class="store-new">
          <input id="store-new-name" type="text" placeholder="新缓存库名称…" autocomplete="off">
          <button id="store-new-btn" class="mini-btn">新建</button>
        </div>
      </div>
      <div class="store-section">
        <div class="store-ops">
          <button id="backup-btn" class="mini-btn">备份当前库</button>
          <button id="restore-btn" class="mini-btn">导入备份</button>
        </div>
      </div>
      <div class="store-section store-list-sec">
        <div class="store-cap">曲目 <span id="store-tracks-hint" class="cap-hint"></span><button id="store-clear-btn" class="mini-btn danger">清空</button></div>
        <div id="store-tracks" class="store-tracks"></div>
      </div>
    </div>
  </div>

  <div id="lyrics-panel" class="panel lyrics-panel hidden">
    <header><span id="lyrics-title">歌词</span> <button id="lyrics-close" class="panel-close"><svg class="ic" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></header>
    <div id="lyrics-body" class="panel-body lyrics-body">
      <div id="lyrics-empty" class="lyrics-empty">播放一首歌来查看歌词</div>
      <div id="lyrics-lines" class="lyrics-lines"></div>
    </div>
  </div>

  <div id="toasts" class="toasts"></div>
</div>
<script src="/app.js"></script>
</body>
</html>
