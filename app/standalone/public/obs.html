<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>qsyy · OBS 歌词</title>
<style>
  :root {
    --accent: #19a58c;
    --text: #ffffff;
    --muted: rgba(255, 255, 255, .62);
    --faint: rgba(255, 255, 255, .32);
    --panel: rgba(8, 10, 16, .52);
    --radius: 18px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  #obs {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    display: flex;
    align-items: flex-end;
    gap: 18px;
    padding: 28px 34px 34px;
    background: linear-gradient(180deg, transparent, rgba(0, 0, 0, .46));
    opacity: 0;
    transition: opacity .35s ease;
  }
  #obs.ready { opacity: 1; }
  #obs.center { justify-content: center; text-align: center; }
  #cover-wrap {
    flex: none;
    width: 92px; height: 92px;
    border-radius: 14px;
    overflow: hidden;
    background: rgba(255, 255, 255, .08);
    box-shadow: 0 12px 36px rgba(0, 0, 0, .42);
  }
  #cover { width: 100%; height: 100%; object-fit: cover; display: none; }
  #cover-wrap.empty { display: none; }
  #copy {
    min-width: 0; flex: 1 1 auto;
    padding: 14px 18px;
    border-radius: var(--radius);
    background: rgba(6, 8, 12, .62);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }
  #meta { display: flex; align-items: baseline; gap: 10px; min-width: 0; margin-bottom: 8px; }
  #title { font-size: 20px; font-weight: 700; letter-spacing: .01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #artist { font-size: 14px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #lyric {
    font-size: 30px;
    font-weight: 800;
    line-height: 1.28;
    letter-spacing: .015em;
    text-shadow: 0 3px 18px rgba(0, 0, 0, .48);
    min-height: 1.28em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #lyric .plain { color: var(--text); }
  #lyric .w {
    --p: 0%;
    color: transparent;
    background: linear-gradient(90deg, var(--accent) var(--p), rgba(255, 255, 255, .3) var(--p));
    -webkit-background-clip: text;
    background-clip: text;
  }
  #translation {
    margin-top: 4px;
    font-size: 16px;
    color: var(--muted);
    min-height: 1.25em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #next {
    margin-top: 8px;
    font-size: 15px;
    color: var(--faint);
    min-height: 1.2em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #progress {
    margin-top: 14px;
    height: 3px;
    border-radius: 99px;
    background: rgba(255, 255, 255, .14);
    overflow: hidden;
  }
  #progress-fill {
    height: 100%; width: 0%;
    border-radius: inherit;
    background: var(--accent);
    transition: width .25s linear;
  }
  #brand {
    position: fixed; right: 16px; bottom: 12px;
    font-size: 11px; letter-spacing: .12em;
    color: rgba(255, 255, 255, .26);
  }
  #idle {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; color: rgba(255, 255, 255, .5);
    background: transparent;
  }
  #obs.hide, #brand.hide, #idle.hide { display: none; }
  body.cover-off #cover-wrap { display: none; }
  body.brand-off #brand { display: none; }
</style>
</head>
<body>
  <div id="idle">qsyy 未在播放</div>
  <div id="obs" aria-live="polite">
    <div id="cover-wrap" class="empty"><img id="cover" alt=""></div>
    <div id="copy">
      <div id="meta"><div id="title"></div><div id="artist"></div></div>
      <div id="lyric"></div>
      <div id="translation"></div>
      <div id="next"></div>
      <div id="progress"><div id="progress-fill"></div></div>
    </div>
  </div>
  <div id="brand">qsyy · OBS 歌词</div>
<script>
(() => {
  const params = new URLSearchParams(location.search);
  const size = Number(params.get('size')) || 1;
  const align = params.get('align') === 'left' ? 'left' : 'center';
  const showCover = params.get('cover') !== '0';
  const showBrand = params.get('brand') !== '0';
  const showTranslation = params.get('translation') !== '0';
  const accent = params.get('accent') || '';
  if (!showCover) document.body.classList.add('cover-off');
  if (!showBrand) document.body.classList.add('brand-off');
  if (accent) document.documentElement.style.setProperty('--accent', accent);

  const $ = id => document.getElementById(id);
  const obs = $('obs');
  const idle = $('idle');
  const cover = $('cover');
  const coverWrap = $('cover-wrap');
  const title = $('title');
  const artist = $('artist');
  const lyric = $('lyric');
  const translation = $('translation');
  const next = $('next');
  const progressFill = $('progress-fill');
  if (align === 'left') obs.classList.remove('center');
  else obs.classList.add('center');
  lyric.style.fontSize = `${Math.round(30 * Math.max(0.6, Math.min(2.4, size)))}px`;

  let state = null;
  let lastLineKey = '';
  let lastWordLine = null;
  let lastWordSpans = [];
  let pollTimer = 0;
  let lyricsTrack = '';
  let lyricsData = null;

  const fmt = ms => {
    const total = Math.max(0, Math.round(Number(ms) || 0));
    return `${Math.floor(total / 60000)}:${String(Math.floor((total % 60000) / 1000)).padStart(2, '0')}`;
  };

  const setText = (el, value) => {
    const text = String(value || '');
    if (el.textContent !== text) el.textContent = text;
  };

  const currentPosition = () => {
    if (!state) return 0;
    const base = Number(state.position) || 0;
    if (!state.playing) return base;
    const drift = Math.max(0, (Date.now() - (Number(state.updatedAt) || Date.now())) / 1000);
    const duration = Number(state.track?.duration) || 0;
    return duration > 0 ? Math.min(duration, base + drift) : base + drift;
  };

  const lineIndexAt = (lines, ms) => {
    let lo = 0;
    let hi = lines.length - 1;
    let idx = -1;
    while (lo <= hi) {
      const mid = (lo + hi) >> 1;
      if ((Number(lines[mid].ms) || 0) <= ms) { idx = mid; lo = mid + 1; }
      else hi = mid - 1;
    }
    return idx;
  };

  const renderLineWords = (line) => {
    if (lastWordLine === line) return;
    lastWordLine = line;
    lastWordSpans = [];
    lyric.textContent = '';
    const words = Array.isArray(line?.words) ? line.words : null;
    if (!words || !words.length) {
      const span = document.createElement('span');
      span.className = 'plain';
      span.textContent = line?.text || '';
      lyric.appendChild(span);
      return;
    }
    for (const word of words) {
      const span = document.createElement('span');
      span.className = 'w';
      span.textContent = word.w || '';
      lyric.appendChild(span);
      lastWordSpans.push(span);
    }
  };

  const paintWords = (line, positionMs) => {
    if (!lastWordSpans.length) return;
    const words = line?.words || [];
    for (let i = 0; i < lastWordSpans.length; i += 1) {
      const word = words[i];
      if (!word) continue;
      const duration = Number(word.d) || 0;
      const progress = duration > 0
        ? (positionMs - (Number(word.t) || 0)) / duration
        : (positionMs >= (Number(word.t) || 0) ? 1 : 0);
      lastWordSpans[i].style.setProperty('--p', `${Math.max(0, Math.min(1, progress)) * 100}%`);
    }
  };

  const render = () => {
    if (!state) return;
    const track = state.track || {};
    const lines = Array.isArray(state.lyrics?.lines) ? state.lyrics.lines : [];
    const positionMs = currentPosition() * 1000 + (Number(state.lyrics?.offset) || 0);
    const idx = lines.length ? lineIndexAt(lines, positionMs) : -1;

    const hasTrack = Boolean(track.title || track.id);
    obs.classList.toggle('ready', hasTrack);
    idle.classList.toggle('hide', hasTrack);
    if (!hasTrack) return;

    setText(title, track.title || '');
    setText(artist, track.artist || '');
    coverWrap.classList.toggle('empty', !track.cover);
    if (track.cover && cover.getAttribute('src') !== track.cover) cover.src = track.cover;
    if (!track.cover) cover.removeAttribute('src');

    const line = idx >= 0 ? lines[idx] : null;
    const nextLine = idx + 1 < lines.length ? lines[idx + 1] : null;
    const key = line ? `${line.ms}:${line.text}` : 'none';
    if (key !== lastLineKey) {
      lastLineKey = key;
      lastWordLine = null;
      renderLineWords(line);
    }
    if (line) paintWords(line, positionMs);
    setText(translation, showTranslation ? (line?.cn || '') : '');
    setText(next, nextLine ? nextLine.text : '');

    const duration = Number(track.duration) || 0;
    const pct = duration > 0 ? Math.max(0, Math.min(1, currentPosition() / duration)) : 0;
    progressFill.style.width = `${(pct * 100).toFixed(2)}%`;
  };

  const poll = async () => {
    clearTimeout(pollTimer);
    try {
      // Progress is polled often; the (potentially large) lyric document is
      // fetched only when the server says a different track's lyrics are live.
      const response = await fetch('/api/now-playing?lyrics=0', { cache: 'no-store' });
      const next = await response.json();
      const lyricsId = String(next.lyricsTrackId || '');
      if (lyricsId && lyricsId !== lyricsTrack) {
        try {
          const lyricResponse = await fetch('/api/lyrics/current', { cache: 'no-store' });
          const lyricPayload = await lyricResponse.json();
          if (String(lyricPayload.track?.id || '') === String(next.track?.id || '')) {
            lyricsData = lyricPayload.lyrics || null;
            lyricsTrack = lyricsId;
          } else {
            lyricsTrack = '';
            lyricsData = null;
          }
        } catch (_) {
          lyricsTrack = '';
          lyricsData = null;
        }
      } else if (!lyricsId) {
        lyricsTrack = '';
        lyricsData = null;
      }
      next.lyrics = next.lyrics || lyricsData;
      state = next;
    } catch (_) {
      state = null;
      obs.classList.remove('ready');
      idle.classList.remove('hide');
    }
    render();
    pollTimer = setTimeout(poll, 320);
  };
  poll();

  // Keep word highlights moving between server pushes.
  setInterval(render, 80);
})();
</script>
</body>
</html>
