<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>qsyy · OBS 歌词舞台</title>
<style>
  :root {
    --accent: #f5c451;
    --accent-rgb: 245, 196, 81;
    --text: #f8fafc;
    --muted: rgba(248, 250, 252, .62);
    --faint: rgba(248, 250, 252, .3);
    --line: rgba(255, 255, 255, .12);
    --translation: #7fb7ff;
    --lyric-font: "Songti SC", "Noto Serif SC", "Yu Mincho", "Hiragino Mincho ProN", serif;
    --sans: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; width: 100%; height: 100%;
    background: #050914; overflow: hidden;
  }
  body {
    font-family: var(--sans);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    text-rendering: geometricPrecision;
  }
  body.transparent { background: transparent; }
  body.theme-tilt { background: radial-gradient(100% 90% at 50% 0%, #131d33 0%, #080d19 48%, #04070d 100%); }
  body.theme-pendolo { background: radial-gradient(95% 90% at 22% 40%, #101c2e 0%, #070c15 52%, #03060b 100%); }
  body.theme-lumi { background: radial-gradient(95% 80% at 50% 26%, #101a32 0%, #070c18 48%, #03060d 100%); }

  #ambient {
    position: fixed; inset: -14%; z-index: 0;
    background-position: center; background-size: cover;
    filter: blur(92px) saturate(1.5) brightness(.48);
    opacity: 0; transform: scale(1.06);
    transition: background-image .6s ease;
    pointer-events: none;
  }
  body.has-cover #ambient { opacity: .30; }
  body.theme-tilt #ambient { opacity: .18; }
  body.theme-pendolo #ambient { opacity: .20; }
  body.transparent #ambient { opacity: 0 !important; }

  #fx {
    position: fixed; inset: 0; z-index: 1;
    width: 100%; height: 100%;
    pointer-events: none;
  }
  #vignette {
    position: fixed; inset: 0; z-index: 2; pointer-events: none;
    background:
      radial-gradient(80% 70% at 50% 42%, transparent 0%, rgba(0,0,0,.14) 58%, rgba(0,0,0,.62) 100%),
      linear-gradient(180deg, rgba(0,0,0,.28), transparent 24%, transparent 70%, rgba(0,0,0,.55));
  }
  body.transparent #vignette { display: none; }

  #ghost-prev, #ghost-next {
    position: fixed; left: 50%; z-index: 1;
    width: 100vw; transform: translateX(-50%);
    text-align: center; white-space: nowrap; overflow: hidden;
    font-family: var(--lyric-font);
    font-size: clamp(56px, 8.4vw, 156px);
    font-weight: 700; letter-spacing: .02em;
    color: rgba(255,255,255,.038);
    pointer-events: none; user-select: none;
    text-shadow: 0 0 80px rgba(var(--accent-rgb), .08);
  }
  #ghost-prev { top: 3vh; transform: translateX(-50%) rotate(-1.2deg); }
  #ghost-next { bottom: 13vh; transform: translateX(-50%) rotate(1deg); }
  body.theme-tilt #ghost-prev, body.theme-tilt #ghost-next,
  body.theme-pendolo #ghost-prev, body.theme-pendolo #ghost-next,
  body.ghost-off #ghost-prev, body.ghost-off #ghost-next { display: none; }

  #lyric-panel {
    position: fixed; left: 50%; top: 47%; z-index: 3;
    width: min(1500px, 92vw);
    transform: translate(-50%, -50%);
    text-align: center;
    transition: opacity .25s ease;
  }
  body:not(.has-track) #lyric-panel, body:not(.has-track) #pill { display: none; }
  body.theme-pendolo #lyric-panel {
    left: 55%; top: 47%; width: 40vw; text-align: left;
    transform: translateY(-50%);
  }

  #lyric-prev {
    min-height: 1.2em; margin-bottom: .35em;
    font-family: var(--lyric-font);
    font-size: clamp(16px, 1.7vw, 28px);
    color: rgba(255,255,255,.22);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #lyric-main {
    font-family: var(--lyric-font);
    font-size: clamp(54px, 7.2vw, 126px);
    font-weight: 700;
    line-height: 1.1;
    letter-spacing: .012em;
    white-space: normal;
    text-wrap: balance;
    text-shadow:
      0 6px 40px rgba(0,0,0,.55),
      0 0 50px rgba(var(--accent-rgb), .12);
    min-height: 1.1em;
  }
  #lyric-main.switching { animation: line-in .5s cubic-bezier(.2,.8,.2,1); }
  @keyframes line-in {
    from { transform: translateY(18px) scale(.985); }
    to { transform: translateY(0) scale(1); }
  }
  #lyric-main .plain { color: var(--text); }
  #lyric-main .w {
    display: inline-block; white-space: pre;
    --p: 0%;
    color: transparent;
    background: linear-gradient(90deg, var(--accent) var(--p), rgba(255,255,255,.88) var(--p));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 0 0 34px rgba(var(--accent-rgb), .18);
    animation: word-in .62s cubic-bezier(.2,.8,.2,1) both;
    animation-delay: calc(var(--i, 0) * 34ms);
    transition: transform .2s ease, filter .2s ease;
    will-change: transform, background;
  }
  #lyric-main .w.active {
    transform: translateY(-3px) scale(1.035);
    filter: drop-shadow(0 0 22px rgba(var(--accent-rgb), .72));
  }
  @keyframes word-in {
    from { opacity: .86; transform: translateY(22px) scale(.94); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  #lyric-main .placeholder { color: var(--faint); font-weight: 500; }

  #lyric-translation {
    margin-top: .45em; min-height: 1.35em;
    font-family: var(--sans);
    font-size: clamp(15px, 1.45vw, 23px);
    font-weight: 500;
    color: var(--translation);
    letter-spacing: .01em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #lyric-next {
    margin-top: .35em; min-height: 1.25em;
    font-family: var(--lyric-font);
    font-size: clamp(16px, 1.65vw, 27px);
    color: rgba(255,255,255,.28);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  /* Lumi uses a quiet serif; Tilt switches to a clean sans with blue highlight. */
  body.theme-tilt { --lyric-font: var(--sans); --translation: rgba(214, 230, 255, .68); }
  body.theme-tilt #lyric-main { font-weight: 800; letter-spacing: -.012em; }
  body.theme-tilt #lyric-prev, body.theme-tilt #lyric-next { display: none; }
  body.theme-tilt #lyric-panel { top: 45%; width: min(1280px, 84vw); }
  body.theme-tilt #lyric-translation { margin-top: .9em; }

  body.theme-pendolo { --lyric-font: var(--sans); --translation: rgba(170, 195, 240, .72); }
  body.theme-pendolo #lyric-main { font-weight: 600; letter-spacing: 0; }
  body.theme-pendolo #lyric-translation { text-align: left; }
  body.theme-pendolo #lyric-next { text-align: left; }

  #pill {
    position: fixed; left: 50%; bottom: 4.2vh; z-index: 4;
    transform: translateX(-50%);
    display: flex; align-items: center; gap: 11px;
    width: min(720px, 68vw);
    padding: 9px 15px 9px 10px;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,.13);
    background: rgba(6, 10, 18, .76);
    box-shadow: 0 16px 50px rgba(0,0,0,.42), inset 0 1px 0 rgba(255,255,255,.08);
    backdrop-filter: blur(22px) saturate(1.2);
    -webkit-backdrop-filter: blur(22px) saturate(1.2);
  }
  body.pill-off #pill { display: none; }
  #pill-play {
    width: 30px; height: 30px; border-radius: 50%; flex: none;
    background: #f8fafc; color: #071018;
    display: grid; place-items: center;
  }
  #pill-play::before {
    content: ""; display: block; width: 0; height: 0;
    border-left: 8px solid #071018; border-top: 5px solid transparent; border-bottom: 5px solid transparent;
    margin-left: 2px;
  }
  #pill.playing #pill-play::before {
    width: 4px; height: 10px; border: 0; margin-left: 0;
    background: #071018; box-shadow: 7px 0 0 #071018;
  }
  #pill-cover {
    width: 34px; height: 34px; flex: none; position: relative; overflow: hidden;
    border-radius: 50%; display: grid; place-items: center;
    background: linear-gradient(135deg, rgba(var(--accent-rgb), .45), rgba(255,255,255,.08));
    box-shadow: 0 4px 18px rgba(0,0,0,.35), inset 0 0 0 1px rgba(255,255,255,.12);
  }
  #pill-cover img { width: 100%; height: 100%; object-fit: cover; display: none; }
  #pill-cover.has-cover img { display: block; }
  #pill-cover.has-cover .note { display: none; }
  #pill-cover .note { font-size: 14px; color: rgba(255,255,255,.76); }
  #pill-meta { min-width: 0; width: 168px; flex: none; display: flex; flex-direction: column; }
  #pill-title { font-size: 11px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #pill-artist { margin-top: 1px; font-size: 9px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #pill-progress { flex: 1; height: 3px; border-radius: 99px; background: rgba(255,255,255,.13); overflow: hidden; }
  #pill-progress-fill { display: block; height: 100%; width: 0%; border-radius: inherit; background: linear-gradient(90deg, var(--accent), rgba(var(--accent-rgb), .4)); box-shadow: 0 0 10px rgba(var(--accent-rgb), .5); transition: width .25s linear; }
  #pill-time { flex: none; color: var(--faint); font-size: 9px; font-variant-numeric: tabular-nums; white-space: nowrap; }

  #idle {
    position: fixed; inset: 0; z-index: 5;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    color: var(--muted); font-size: 15px; letter-spacing: .02em;
  }
  #idle.hide { display: none; }
  .pulse {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 0 rgba(var(--accent-rgb), .55);
    animation: pulse 1.9s ease-out infinite;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(var(--accent-rgb), .55); }
    70% { box-shadow: 0 0 0 14px rgba(var(--accent-rgb), 0); }
    100% { box-shadow: 0 0 0 0 rgba(var(--accent-rgb), 0); }
  }

  #brand {
    position: fixed; right: 18px; bottom: 12px; z-index: 4;
    font-size: 10px; letter-spacing: .17em;
    color: rgba(255,255,255,.25);
    pointer-events: none;
  }
  body.brand-off #brand { display: none; }
  body.translation-off #lyric-translation { display: none; }

  @media (max-width: 760px) {
    #lyric-main { font-size: clamp(34px, 9vw, 58px); }
    #lyric-panel { width: 92vw; }
    body.theme-pendolo #lyric-panel { left: 46%; width: 48vw; }
    #ghost-prev, #ghost-next { font-size: 18vw; }
    #pill { width: calc(100vw - 24px); bottom: 2.5vh; }
    #pill-meta { width: 120px; }
    #lyric-prev, #lyric-next { display: none; }
  }
</style>
</head>
<body class="theme-lumi">
  <div id="ambient"></div>
  <canvas id="fx"></canvas>
  <div id="vignette"></div>
  <div id="ghost-prev"></div>
  <div id="ghost-next"></div>
  <main id="lyric-panel">
    <div id="lyric-prev"></div>
    <div id="lyric-main"><span class="placeholder">等待播放…</span></div>
    <div id="lyric-translation"></div>
    <div id="lyric-next"></div>
  </main>
  <div id="pill">
    <span id="pill-play" aria-hidden="true"></span>
    <span id="pill-cover"><img id="pill-cover-img" alt=""><span class="note">♪</span></span>
    <span id="pill-meta"><span id="pill-title"></span><span id="pill-artist"></span></span>
    <span id="pill-progress"><span id="pill-progress-fill"></span></span>
    <span id="pill-time">0:00 / 0:00</span>
  </div>
  <div id="idle"><span class="pulse"></span> qsyy 未在播放</div>
  <div id="brand">qsyy · LUMI</div>
<script>
(() => {
  const params = new URLSearchParams(location.search);
  const theme = ['lumi', 'tilt', 'pendolo'].includes(params.get('theme')) ? params.get('theme') : 'lumi';
  const transparent = params.get('bg') === 'transparent';
  const showPill = params.get('pill') !== '0';
  const showTranslation = params.get('translation') !== '0';
  const showBrand = params.get('brand') !== '0';
  const showGhost = params.get('ghost') !== '0';
  const customAccent = params.get('accent') || '';
  const size = Math.max(0.7, Math.min(1.8, Number(params.get('size')) || 1));

  document.body.classList.add(`theme-${theme}`);
  if (transparent) document.body.classList.add('transparent');
  if (!showPill) document.body.classList.add('pill-off');
  if (!showTranslation) document.body.classList.add('translation-off');
  if (!showBrand) document.body.classList.add('brand-off');
  if (!showGhost) document.body.classList.add('ghost-off');
  if (customAccent && /^#?[0-9a-f]{6}$/i.test(customAccent)) {
    const hex = customAccent.replace('#', '');
    const rgb = [0, 2, 4].map(i => parseInt(hex.slice(i, i + 2), 16));
    document.documentElement.style.setProperty('--accent', `rgb(${rgb.join(', ')})`);
    document.documentElement.style.setProperty('--accent-rgb', rgb.join(', '));
  }

  const $ = id => document.getElementById(id);
  const ambient = $('ambient');
  const idle = $('idle');
  const lyricPanel = $('lyric-panel');
  const lyricPrev = $('lyric-prev');
  const lyricMain = $('lyric-main');
  const lyricTranslation = $('lyric-translation');
  const lyricNext = $('lyric-next');
  const ghostPrev = $('ghost-prev');
  const ghostNext = $('ghost-next');
  const pill = $('pill');
  const pillPlay = $('pill-play');
  const pillCover = $('pill-cover');
  const pillCoverImg = $('pill-cover-img');
  const pillTitle = $('pill-title');
  const pillArtist = $('pill-artist');
  const pillProgressFill = $('pill-progress-fill');
  const pillTime = $('pill-time');
  const brand = $('brand');
  brand.textContent = `qsyy · ${theme.toUpperCase()}`;

  let state = null;
  let lastLineKey = '';
  let lastWordLine = null;
  let lastWordSpans = [];
  let lyricsTrack = '';
  let lyricsData = null;
  let pollTimer = 0;
  let lastCover = '';
  let accentRgb = [245, 196, 81];
  let progress = 0;

  const setText = (el, value) => {
    const text = String(value || '');
    if (el && el.textContent !== text) el.textContent = text;
  };
  const fmtTime = ms => {
    const total = Math.max(0, Math.round((Number(ms) || 0) / 1000));
    return `${Math.floor(total / 60)}:${String(total % 60).padStart(2, '0')}`;
  };
  const currentPosition = () => {
    if (!state) return 0;
    const base = Number(state.position) || 0;
    if (!state.playing) return base;
    const drift = Math.max(0, (Date.now() - (Number(state.updatedAt) || Date.now())) / 1000);
    const duration = Number(state.track?.duration) || 0;
    return duration > 0 ? Math.min(duration, base + drift) : base + drift;
  };
  const lineIndexAt = (lines, ms) => {
    let lo = 0, hi = lines.length - 1, idx = -1;
    while (lo <= hi) {
      const mid = (lo + hi) >> 1;
      if ((Number(lines[mid].ms) || 0) <= ms) { idx = mid; lo = mid + 1; }
      else hi = mid - 1;
    }
    return idx;
  };
  const extractAccent = img => {
    try {
      const canvas = document.createElement('canvas');
      canvas.width = canvas.height = 18;
      const ctx = canvas.getContext('2d', { willReadFrequently: true });
      ctx.drawImage(img, 0, 0, 18, 18);
      const { data } = ctx.getImageData(0, 0, 18, 18);
      let r = 0, g = 0, b = 0, weight = 0;
      for (let i = 0; i < data.length; i += 4) {
        const rr = data[i], gg = data[i + 1], bb = data[i + 2];
        const mx = Math.max(rr, gg, bb), mn = Math.min(rr, gg, bb);
        if (mx < 36) continue;
        const sat = mx - mn;
        if (sat < 12) continue;
        const w = sat * (0.5 + mx / 255);
        r += rr * w; g += gg * w; b += bb * w; weight += w;
      }
      if (!weight) return;
      accentRgb = [Math.round(r / weight), Math.round(g / weight), Math.round(b / weight)];
      document.documentElement.style.setProperty('--accent', `rgb(${accentRgb.join(', ')})`);
      document.documentElement.style.setProperty('--accent-rgb', accentRgb.join(', '));
    } catch (_) {}
  };
  const setCover = url => {
    if (!url) {
      pillCoverImg.removeAttribute('src');
      pillCover.classList.remove('has-cover');
      ambient.classList.remove('has-image');
      document.body.classList.remove('has-cover');
      lastCover = '';
      return;
    }
    if (url === lastCover) return;
    lastCover = url;
    pillCover.classList.add('has-cover');
    document.body.classList.add('has-cover');
    pillCoverImg.onload = () => {
      if (lastCover !== url) return;
      extractAccent(pillCoverImg);
      ambient.style.backgroundImage = `url("${url.replace(/"/g, '\\"')}")`;
      ambient.classList.add('has-image');
    };
    pillCoverImg.src = url;
  };
  const fitSize = line => {
    const len = Array.from(String(line?.text || '').replace(/\s/g, '')).length;
    if (theme === 'pendolo') {
      if (len > 34) return 'clamp(24px, 2.5vw, 43px)';
      if (len > 22) return 'clamp(28px, 3vw, 52px)';
      return `clamp(32px, ${3.6 * size}vw, ${Math.round(68 * size)}px)`;
    }
    if (theme === 'tilt') {
      if (len > 34) return 'clamp(34px, 4.6vw, 78px)';
      if (len > 22) return `clamp(42px, ${5.4 * size}vw, ${Math.round(98 * size)}px)`;
      return `clamp(52px, ${7 * size}vw, ${Math.round(126 * size)}px)`;
    }
    if (len > 34) return 'clamp(32px, 4vw, 72px)';
    if (len > 22) return `clamp(42px, ${5.2 * size}vw, ${Math.round(96 * size)}px)`;
    return `clamp(52px, ${7 * size}vw, ${Math.round(126 * size)}px)`;
  };
  const renderWords = line => {
    if (lastWordLine === line) return;
    lastWordLine = line;
    lastWordSpans = [];
    lyricMain.textContent = '';
    lyricMain.classList.remove('switching');
    if (!line) {
      lyricMain.innerHTML = '<span class="placeholder">等待播放…</span>';
      return;
    }
    lyricMain.style.fontSize = fitSize(line);
    const words = Array.isArray(line.words) ? line.words : null;
    if (!words || !words.length) {
      const span = document.createElement('span');
      span.className = 'plain';
      span.textContent = line.text || '';
      lyricMain.appendChild(span);
      return;
    }
    words.forEach((word, index) => {
      const span = document.createElement('span');
      span.className = 'w';
      span.style.setProperty('--i', index);
      span.textContent = word.w || '';
      lyricMain.appendChild(span);
      lastWordSpans.push(span);
    });
  };
  const paintWords = (line, positionMs) => {
    if (!lastWordSpans.length) return;
    const words = line?.words || [];
    for (let i = 0; i < lastWordSpans.length; i += 1) {
      const word = words[i];
      if (!word) continue;
      const duration = Number(word.d) || 0;
      const p = duration > 0
        ? (positionMs - (Number(word.t) || 0)) / duration
        : (positionMs >= (Number(word.t) || 0) ? 1 : 0);
      const clamped = Math.max(0, Math.min(1, p));
      lastWordSpans[i].style.setProperty('--p', `${clamped * 100}%`);
      lastWordSpans[i].classList.toggle('active', clamped > 0 && clamped < 1);
    }
  };
  const renderPill = track => {
    setText(pillTitle, track.title || '');
    setText(pillArtist, track.artist || '');
    setCover(track.cover || '');
    pill.classList.toggle('playing', Boolean(state?.playing));
    const duration = Number(track.duration) || 0;
    const position = currentPosition();
    progress = duration > 0 ? Math.max(0, Math.min(1, position / duration)) : 0;
    pillProgressFill.style.width = `${(progress * 100).toFixed(2)}%`;
    pillTime.textContent = `${fmtTime(position * 1000)} / ${fmtTime(duration * 1000)}`;
  };
  const render = () => {
    if (!state) return;
    const track = state.track || {};
    const lines = Array.isArray(state.lyrics?.lines) ? state.lyrics.lines : [];
    const positionMs = currentPosition() * 1000 + (Number(state.lyrics?.offset) || 0);
    const idx = lines.length ? lineIndexAt(lines, positionMs) : -1;
    const hasTrack = Boolean(track.title || track.id);
    document.body.classList.toggle('has-track', hasTrack);
    idle.classList.toggle('hide', hasTrack);
    if (!hasTrack) return;

    renderPill(track);

    const line = idx >= 0 ? lines[idx] : null;
    const previous = idx > 0 ? lines[idx - 1] : null;
    const following = idx + 1 < lines.length ? lines[idx + 1] : null;
    const key = line ? `${line.ms}:${line.text}` : 'none';
    if (key !== lastLineKey) {
      lastLineKey = key;
      lastWordLine = null;
      renderWords(line);
      void lyricMain.offsetWidth;
      lyricMain.classList.add('switching');
      setText(lyricPrev, previous ? previous.text : '');
      setText(lyricNext, following ? following.text : '');
      setText(ghostPrev, lines[idx - 2]?.text || previous?.text || '');
      setText(ghostNext, lines[idx + 2]?.text || following?.text || '');
    }
    if (line) paintWords(line, positionMs);
    setText(lyricTranslation, line?.cn || '');
  };
  const poll = async () => {
    clearTimeout(pollTimer);
    try {
      const response = await fetch('/api/now-playing?lyrics=0', { cache: 'no-store' });
      const nextState = await response.json();
      const lyricsId = String(nextState.lyricsTrackId || '');
      if (lyricsId && lyricsId !== lyricsTrack) {
        try {
          const lyricResponse = await fetch('/api/lyrics/current', { cache: 'no-store' });
          const lyricPayload = await lyricResponse.json();
          if (String(lyricPayload.track?.id || '') === String(nextState.track?.id || '')) {
            lyricsData = lyricPayload.lyrics || null;
            lyricsTrack = lyricsId;
          } else {
            lyricsTrack = '';
            lyricsData = null;
          }
        } catch (_) {
          lyricsTrack = '';
          lyricsData = null;
        }
      } else if (!lyricsId) {
        lyricsTrack = '';
        lyricsData = null;
      }
      nextState.lyrics = nextState.lyrics || lyricsData;
      state = nextState;
    } catch (_) {
      state = null;
      idle.classList.remove('hide');
      document.body.classList.remove('has-track');
    }
    render();
    pollTimer = setTimeout(poll, 320);
  };
  poll();
  setInterval(render, 80);

  // ------------------------------------------------------------ stage canvas
  const canvas = $('fx');
  const ctx = canvas?.getContext('2d');
  if (!canvas || !ctx) return;

  const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const FPS = Math.max(15, Math.min(60, Number(params.get('fps')) || (reducedMotion ? 30 : 45)));
  const DPR_CAP = 1.5;
  const SPEC_N = 48;
  const spectrum = new Float32Array(SPEC_N);
  const particles = [];
  let W = 0, H = 0, DPR = 1;
  let raf = 0, lastDraw = 0;

  const resize = () => {
    W = window.innerWidth || 1280;
    H = window.innerHeight || 720;
    DPR = Math.min(window.devicePixelRatio || 1, DPR_CAP);
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    canvas.style.width = `${W}px`;
    canvas.style.height = `${H}px`;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    if (!particles.length) initParticles();
  };
  const initParticles = () => {
    particles.length = 0;
    const count = reducedMotion ? 42 : (theme === 'pendolo' ? 90 : 110);
    for (let i = 0; i < count; i += 1) {
      particles.push({
        x: Math.random() * W,
        y: Math.random() * H,
        r: 0.7 + Math.random() * 2.2,
        vx: -6 + Math.random() * 12,
        vy: -8 - Math.random() * 20,
        phase: Math.random() * Math.PI * 2,
        alpha: 0.12 + Math.random() * 0.38,
      });
    }
  };
  const targetSpectrum = () => {
    const data = state?.spectrum;
    if (!Array.isArray(data) || !data.length) {
      const t = performance.now() / 1000;
      const amp = state?.playing ? 1 : 0.32;
      return Array.from({ length: SPEC_N }, (_, i) => {
        const base = 0.09 + 0.06 * Math.sin(t * 1.6 + i * 0.33) + 0.04 * Math.sin(t * 2.7 - i * 0.19);
        return Math.max(0.02, base * amp);
      });
    }
    return Array.from({ length: SPEC_N }, (_, i) => {
      const pos = (i / (SPEC_N - 1)) * (data.length - 1);
      const a = Math.floor(pos), b = Math.min(data.length - 1, a + 1);
      const v = (Number(data[a]) || 0) + ((Number(data[b]) || 0) - (Number(data[a]) || 0)) * (pos - a);
      return Math.max(0, Math.min(1, Math.pow(v / 255, 0.78)));
    });
  };

  const rgba = (alpha) => `rgba(${accentRgb.join(',')}, ${alpha})`;
  const white = alpha => `rgba(255,255,255,${alpha})`;

  const drawStar = (cx, cy, radius, rotation, alpha) => {
    ctx.beginPath();
    for (let i = 0; i < 10; i += 1) {
      const r = i % 2 ? radius * .42 : radius;
      const a = rotation + (i / 10) * Math.PI * 2 - Math.PI / 2;
      const x = cx + Math.cos(a) * r, y = cy + Math.sin(a) * r;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.strokeStyle = white(alpha);
    ctx.lineWidth = 1.4;
    ctx.stroke();
  };
  const drawCross = (cx, cy, size, rotation, alpha) => {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(rotation);
    ctx.strokeStyle = white(alpha);
    ctx.lineWidth = Math.max(5, size * .18);
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-size / 2, 0); ctx.lineTo(size / 2, 0);
    ctx.moveTo(0, -size / 2); ctx.lineTo(0, size / 2);
    ctx.stroke();
    ctx.restore();
  };
  const drawCircle = (cx, cy, radius, alpha) => {
    ctx.beginPath();
    ctx.arc(cx, cy, radius, 0, Math.PI * 2);
    ctx.strokeStyle = white(alpha);
    ctx.lineWidth = 1.2;
    ctx.stroke();
  };
  const drawSquiggle = (cx, cy, width, amp, phase, alpha) => {
    ctx.beginPath();
    for (let i = 0; i <= 28; i += 1) {
      const x = cx + (i / 28 - .5) * width;
      const y = cy + Math.sin(i * .62 + phase) * amp;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.strokeStyle = white(alpha);
    ctx.lineWidth = 1.2;
    ctx.lineCap = 'round';
    ctx.stroke();
  };
  const drawTriangle = (cx, cy, size, rotation, alpha) => {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(rotation);
    ctx.beginPath();
    ctx.moveTo(0, -size * .58);
    ctx.lineTo(size * .52, size * .35);
    ctx.lineTo(-size * .52, size * .35);
    ctx.closePath();
    ctx.fillStyle = rgba(alpha * .45);
    ctx.fill();
    ctx.strokeStyle = white(alpha);
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.restore();
  };
  const drawGear = (cx, cy, radius, teeth, rotation, alpha) => {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(rotation);
    ctx.strokeStyle = `rgba(185, 210, 255, ${alpha})`;
    ctx.lineWidth = 1.3;
    ctx.beginPath();
    ctx.arc(0, 0, radius, 0, Math.PI * 2);
    ctx.stroke();
    for (let i = 0; i < teeth; i += 1) {
      const a = (i / teeth) * Math.PI * 2;
      const inner = radius * .92, outer = radius * 1.08;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a) * inner, Math.sin(a) * inner);
      ctx.lineTo(Math.cos(a) * outer, Math.sin(a) * outer);
      ctx.stroke();
    }
    ctx.beginPath();
    ctx.arc(0, 0, radius * .64, 0, Math.PI * 2);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(0, 0, radius * .16, 0, Math.PI * 2);
    ctx.stroke();
    for (let i = 0; i < 6; i += 1) {
      const a = (i / 6) * Math.PI * 2;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a) * radius * .18, Math.sin(a) * radius * .18);
      ctx.lineTo(Math.cos(a) * radius * .6, Math.sin(a) * radius * .6);
      ctx.stroke();
    }
    ctx.restore();
  };
  const drawCoverWindow = (cx, cy, radius) => {
    if (pillCoverImg.complete && pillCoverImg.naturalWidth) {
      ctx.save();
      ctx.beginPath();
      ctx.arc(cx, cy, radius, 0, Math.PI * 2);
      ctx.clip();
      ctx.globalAlpha = .34;
      ctx.drawImage(pillCoverImg, cx - radius, cy - radius, radius * 2, radius * 2);
      ctx.globalAlpha = 1;
      ctx.fillStyle = 'rgba(8, 18, 36, .42)';
      ctx.fillRect(cx - radius, cy - radius, radius * 2, radius * 2);
      ctx.restore();
    } else {
      ctx.beginPath();
      ctx.arc(cx, cy, radius * .72, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(185,210,255,.10)';
      ctx.lineWidth = 1;
      ctx.stroke();
    }
    ctx.beginPath();
    ctx.arc(cx, cy, radius, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(185,210,255,.18)';
    ctx.lineWidth = 2;
    ctx.stroke();
  };

  const drawStageBackground = t => {
    if (transparent) {
      // Keep the stage light and transparent for overlay use.
      const g = ctx.createRadialGradient(W * .5, H * .45, 0, W * .5, H * .45, Math.max(W, H) * .58);
      g.addColorStop(0, rgba(.10));
      g.addColorStop(.55, rgba(.035));
      g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);
    }

    if (theme === 'lumi') {
      drawTriangle(W * .5, H * .48, Math.min(W, H) * .92, -.03, .055);
      drawStar(W * .15 + Math.sin(t * .12) * 18, H * .32, Math.min(W, H) * .085, t * .035, .10);
      drawStar(W * .82 + Math.sin(t * .09 + 2) * 22, H * .23, Math.min(W, H) * .11, -t * .028, .07);
      drawCircle(W * .79, H * .18, Math.min(W, H) * .055, .07);
      drawCircle(W * .19, H * .71, Math.min(W, H) * .09, .06);
      drawSquiggle(W * .13, H * .18, W * .16, H * .025, t * .2, .08);
      drawSquiggle(W * .88, H * .68, W * .14, H * .02, -t * .17, .07);
      ctx.save();
      ctx.setLineDash([3, 12]);
      drawCircle(W * .5, H * .48, Math.min(W, H) * .41, .035);
      ctx.restore();
    } else if (theme === 'tilt') {
      drawCross(W * .86, H * .14, Math.min(W, H) * .075, .18 + Math.sin(t * .1) * .04, .10);
      drawCross(W * .91, H * .36, Math.min(W, H) * .055, -.3, .07);
      drawCross(W * .74, H * .76, Math.min(W, H) * .05, .4, .06);
      drawCross(W * .08, H * .58, Math.min(W, H) * .045, -.2, .06);
      drawCircle(W * .17, H * .9, Math.min(W, H) * .12, .08);
      drawCircle(W * .78, H * .8, Math.min(W, H) * .16, .06);
      drawStar(W * .14, H * .9, Math.min(W, H) * .05, t * .02, .07);
      drawStar(W * .87, H * .26, Math.min(W, H) * .04, -t * .03, .06);
      drawSquiggle(W * .5, H * .12, W * .18, H * .025, t * .2, .07);
      drawSquiggle(W * .9, H * .55, W * .12, H * .02, -t * .2, .06);
      drawTriangle(W * .5, H * .76, Math.min(W, H) * .38, .04, .04);
    } else {
      // Pendolo: clockwork left, lyrics right.
      const g = Math.min(W, H);
      drawGear(W * .19, H * .4, g * .26, 30, t * .045, .13);
      drawGear(W * .38, H * .23, g * .14, 22, -t * .075, .11);
      drawGear(W * .36, H * .65, g * .12, 20, t * .09, .10);
      drawGear(W * .49, H * .49, g * .08, 18, -t * .11, .09);
      drawCoverWindow(W * .21, H * .43, g * .215);
      ctx.save();
      ctx.setLineDash([2, 10]);
      drawCircle(W * .21, H * .43, g * .30, .06);
      ctx.restore();
      drawStar(W * .72, H * .18, g * .018, t * .04, .12);
      drawStar(W * .85, H * .27, g * .012, -t * .05, .10);
      drawStar(W * .64, H * .78, g * .010, t * .03, .08);
    }
  };

  const drawParticles = (t, dt) => {
    ctx.globalCompositeOperation = 'lighter';
    const energy = spectrum.reduce((a, b) => a + b, 0) / SPEC_N;
    for (const p of particles) {
      p.x += (p.vx + Math.sin(t * .6 + p.phase) * 4) * dt;
      p.y += (p.vy - energy * 8) * dt;
      if (p.y < -12) { p.y = H + 12; p.x = Math.random() * W; }
      if (p.x < -12) p.x = W + 12;
      if (p.x > W + 12) p.x = -12;
      const alpha = Math.min(.7, p.alpha + energy * .36);
      ctx.fillStyle = theme === 'pendolo'
        ? `rgba(205, 225, 255, ${alpha})`
        : rgba(alpha);
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r * (.8 + energy * 1.3), 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';
  };

  const drawSpectrumLine = () => {
    const baseY = H - 44;
    const width = W * .64;
    const left = (W - width) / 2;
    const step = width / (SPEC_N - 1);
    ctx.beginPath();
    for (let i = 0; i < SPEC_N; i += 1) {
      const x = left + i * step;
      const y = baseY - spectrum[i] * 44;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.strokeStyle = rgba(theme === 'pendolo' ? .20 : .28);
    ctx.lineWidth = 1.4;
    ctx.lineJoin = 'round';
    ctx.stroke();
    ctx.lineTo(left + width, baseY);
    ctx.lineTo(left, baseY);
    ctx.closePath();
    const fill = ctx.createLinearGradient(0, baseY - 44, 0, baseY);
    fill.addColorStop(0, rgba(.10));
    fill.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = fill;
    ctx.fill();
  };

  const frame = now => {
    raf = requestAnimationFrame(frame);
    if (document.hidden) return;
    if (now - lastDraw < 1000 / FPS) return;
    const dt = Math.min(.06, (now - lastDraw) / 1000 || .016);
    lastDraw = now;
    const target = targetSpectrum();
    const ease = state?.playing ? .18 : .07;
    for (let i = 0; i < SPEC_N; i += 1) spectrum[i] += (target[i] - spectrum[i]) * ease;
    ctx.clearRect(0, 0, W, H);
    drawStageBackground(now / 1000);
    drawParticles(now / 1000, dt);
    drawSpectrumLine();
  };

  window.addEventListener('resize', resize, { passive: true });
  resize();
  raf = requestAnimationFrame(frame);
  window.qsyyObsDraw = () => { if (raf) cancelAnimationFrame(raf); lastDraw = 0; frame(performance.now()); };
})();
</script>
</body>
</html>
