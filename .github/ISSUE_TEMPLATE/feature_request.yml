name: 功能建议
description: 提一个新功能或改进想法，先说清要解决什么问题。
labels: ["enhancement"]
body:
  - type: textarea
    id: feature
    attributes:
      label: 想要的功能
      description: 具体描述你希望 qsyy 能做什么。
      placeholder: 例如：下载时支持自定义文件名模板。
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 解决什么问题
      description: 现在缺了它导致什么不便？没有真实场景的建议大概率不做。
      placeholder: 例如：批量下载后文件全是曲目 ID，整理歌单要逐个改名。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 你试过或想过的其他做法，以及它们为什么不够好。
    validations:
      required: false

  - type: dropdown
    id: contribute
    attributes:
      label: 愿意参与实现吗
      options:
        - 愿意，我可以提 PR
        - 愿意帮忙测试或补充细节
        - 只是提个想法
    validations:
      required: true
