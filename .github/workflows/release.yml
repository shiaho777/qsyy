name: release
# Tag-driven three-platform release: macOS (dmg/zip), Windows (nsis/zip),
# Android (apk). Creates the GitHub Release and publishes a changelog built
# from Conventional Commits. CI (ci.yml) is the merge gate; this workflow
# publishes artifacts but never closes Issues.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  changelog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      notes: ${{ steps.notes.outputs.text }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - id: notes
        name: Build changelog from conventional commits
        run: |
          PREV=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          node scripts/release-notes.mjs "$PREV" "$(git rev-parse --short HEAD)" > notes.md
          cat notes.md
          {
            echo 'text<<CHANGELOG_EOF'
            cat notes.md
            echo CHANGELOG_EOF
          } >> "$GITHUB_OUTPUT"

  desktop-mac:
    runs-on: macos-14
    needs: changelog
    timeout-minutes: 60
    env:
      # GH runners stall for 30-60min fetching electron zips from
      # github releases object storage (seen on two consecutive v1.0.0
      # attempts); npmmirror serves the same artifacts reliably.
      ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
      ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # electron-builder re-downloads ~115MB of Electron + code-sign binaries
      # per run; a cold Windows runner stalled 29min on that download and hit
      # the job timeout. Cache the electron-builder store by lockfile hash.
      - name: Cache electron-builder downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: eb-mac-${{ hashFiles('desktop/package-lock.json', 'desktop/package.json') }}
          restore-keys: eb-mac-

      - name: Install dependencies
        run: |
          npm install --prefix app/bridge --no-audit --no-fund
          npm install --prefix desktop --no-audit --no-fund

      - name: Build macOS app (dmg + zip)
        working-directory: desktop
        run: npm run dist:mac

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.zip

  # Windows installer is built on the maintainer's machine and attached to
  # the Release after publish: electron-builder's Windows packaging hangs
  # indefinitely on windows-latest (five v1.0.0 attempts, see Issue #13 —
  # downloads fixed by mirrors, the packaging stage itself stalls after the
  # signtool step). The mac job proves the app config builds fine; only the
  # runner's win packaging path is broken.
  android:
    runs-on: ubuntu-latest
    needs: changelog
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Assemble debug APK (runnable out of the box)
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK with version tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          cp android/app/build/outputs/apk/debug/app-debug.apk "android/qsyy-${TAG}.apk"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: android/qsyy-*.apk

  publish:
    runs-on: ubuntu-latest
    needs: [changelog, desktop-mac, android]
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ needs.changelog.outputs.notes }}

      - name: Upload assets (layout-agnostic)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # download-artifact's target directory has shifted between versions
          # (artifacts/<name>/ on some runs, artifact/ on others) — globbing a
          # fixed path silently missed files twice. Locate real files by name
          # anywhere in the workspace instead.
          set -e
          mkdir -p assets
          find . -path ./.git -prune -o -path ./assets -prune -o \
            -type f \( -name '*.dmg' -o -name '*-mac.zip' -o -name '*.apk' \) \
            -exec cp {} assets/ \;
          ls -la assets/
          test -n "$(ls -A assets)"
          gh release upload "$GITHUB_REF_NAME" assets/* --clobber
