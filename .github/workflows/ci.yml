name: ci
# Fast gate for every push/PR: syntax, unit tests and structural checks.
# Release builds live in release.yml (tag v*). This workflow never closes
# Issues and never publishes artifacts.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: JS / MJS syntax check
        run: |
          for f in $(git ls-files '*.mjs' '*.js'); do
            case "$f" in app/bridge/node_modules/*|desktop/node_modules/*) continue;; esac
            node --check "$f"
          done

      - name: Unit tests
        run: node --test app/standalone/*.test.mjs

      - name: Workflow YAML well-formed
        # Ruby ships on ubuntu-latest; a real parse catches indentation and
        # syntax errors, not just tabs.
        run: |
          ruby -ryaml -e '
            ARGV.each do |f|
              doc = YAML.load_file(f)
              raise "#{f}: empty or not a mapping" unless doc.is_a?(Hash)
            end
          ' .github/workflows/*.yml

      - name: Android runtime whitelist covers server imports
        # syncQsyyRuntime copies app/standalone by explicit include(); a module
        # missing there only fails at APK runtime (ERR_MODULE_NOT_FOUND).
        run: |
          node -e '
            const fs = require("fs"), path = require("path");
            const gradle = fs.readFileSync("android/app/build.gradle.kts", "utf8");
            const block = gradle.match(/app\/standalone"\)\)\s*\{\s*include\(([^)]*)\)/);
            if (!block) { console.error("syncQsyyRuntime: standalone include() not found"); process.exit(1); }
            const listed = new Set([...block[1].matchAll(/"([^"]+)"/g)].map(m => m[1]));
            const seen = new Set(), queue = ["server.mjs", "ttnet-helper.mjs"];
            let bad = 0;
            while (queue.length) {
              const f = queue.shift();
              if (seen.has(f)) continue;
              seen.add(f);
              if (!listed.has(f)) { console.error(`syncQsyyRuntime misses standalone/${f}`); bad = 1; }
              const src = fs.readFileSync(path.join("app/standalone", f), "utf8");
              for (const m of src.matchAll(/(?:from|import\()\s*["\x27]\.\/([^"\x27]+)["\x27]/g)) queue.push(m[1]);
            }
            process.exit(bad);
          '

      - name: Doc links resolve
        run: |
          node -e '
            const fs = require("fs"), path = require("path");
            let bad = 0;
            for (const doc of ["README.md", "app/PLATFORM-macOS.md"]) {
              const text = fs.readFileSync(doc, "utf8");
              const refs = [...text.matchAll(/\]\((\.{1,2}\/[^)#]+)/g)].map(m => m[1]);
              for (const ref of new Set(refs)) {
                if (!fs.existsSync(path.resolve(path.dirname(doc), ref))) {
                  console.error(`${doc}: broken link ${ref}`); bad = 1;
                }
              }
            }
            process.exit(bad);
          '
